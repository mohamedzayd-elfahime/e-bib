[project]
name = "e-bib"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "jinja2",
  "python-multipart",
  "python-dotenv",
  "sqlalchemy",
  "pymysql",
  "argon2-cffi",
  "python-jose[cryptography]",
  "itsdangerous",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
